# Pass@1 Code Profile
# Small population: only one candidate generated per problem

initial_prior: 0.2
initial_population_size: 1
max_population_size: 1
offspring_rate: 0.0
elitism_rate: 1.0

# Operation rates (must sum to 1.0)
op_rates:
  mutation: 0.0
  crossover: 0.0
  generic_repair: 1.0

# Initialization rates (must sum to 1.0)
init_rates:
  direct: 1.0

# Performance settings
init_pop_batch_size: 1

diversity_enabled: false
prob_assigner_strategy: "min"
