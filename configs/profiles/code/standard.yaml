# Standard Code Profile
# Balanced settings for code evolution

initial_prior: 0.2
initial_population_size: 10
max_population_size: 15
offspring_rate: 0.3
elitism_rate: 0.3

# Operation rates (must sum to 1.0)
op_rates:
  mutation: 0.1
  crossover: 0.1
  generic_repair: 0.4
  unittest_repair: 0.2
  property_repair: 0.2

# Initialization rates (must sum to 1.0)
init_rates:
  direct: 1.0

# Performance settings
init_pop_batch_size: 2

# Selection strategy
diversity_enabled: true
prob_assigner_strategy: "min"
